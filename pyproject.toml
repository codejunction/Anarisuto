[project]
name = "analyst"
version = "0.1.0"
description = "Evidence-first research analyst harness on CrewAI"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[anthropic]>=1.15",
    "crewai-tools[mcp]>=1.15",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "pypdf",
]

[project.optional-dependencies]
dev = ["pytest"]
local = ["ollama"]  # Ollama embeddings (embed_model in config.yaml)

[project.scripts]
analyst = "analyst.__main__:main"

[tool.setuptools]
packages = ["analyst"]

[tool.setuptools.package-data]
analyst = ["static/*"]
