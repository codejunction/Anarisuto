[project]
name = "analyst"
version = "0.1.0"
description = "Evidence-first research analyst harness on pydantic-ai"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "pypdf",
    "ollama",  # Ollama embeddings (embed_model in config.yaml)
    "pydantic-ai-slim[anthropic,mcp,openai]>=2.54.0",
    "chromadb>=1.5.9",
    "pyyaml>=6.0.3",
    "httpx>=0.28.1",
]

[project.scripts]
analyst = "analyst.__main__:main"

[dependency-groups]
dev = ["pytest"]  # installed by `uv sync` by default

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["analyst"]

[tool.setuptools.package-data]
analyst = ["static/*"]
